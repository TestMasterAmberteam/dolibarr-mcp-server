[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dolibarr-mcp-server"
version = "0.4.1"
description = "Stateless MCP server for per-user Dolibarr API access"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jan Sabak" },
]
keywords = ["dolibarr", "mcp", "model-context-protocol", "asgi", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx2>=2.9,<3",
  "mcp>=2.0,<3",
  "pydantic>=2.12,<3",
  "starlette>=1.4.1,<2",
  "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/TestMasterAmberteam/dolibarr-mcp-server"
Documentation = "https://github.com/TestMasterAmberteam/dolibarr-mcp-server#readme"
Repository = "https://github.com/TestMasterAmberteam/dolibarr-mcp-server.git"
Issues = "https://github.com/TestMasterAmberteam/dolibarr-mcp-server/issues"
Changelog = "https://github.com/TestMasterAmberteam/dolibarr-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
dolibarr-mcp = "dolibarr_mcp.__main__:main"

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1,<3",
  "codespell>=2.4,<3",
  "cyclonedx-bom>=7.1,<8",
  "hatch>=1.14,<2",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<3",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.3,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "twine>=7,<8",
  "types-python-dateutil>=2.9,<3",
  "zizmor>=1.12,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dolibarr_mcp"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --strict-config --strict-markers --basetemp=.pytest-work --cov=dolibarr_mcp --cov-branch --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
filterwarnings = ["error"]
tmp_path_retention_policy = "none"
markers = [
  "integration: exercises the complete ASGI transport stack",
  "live_network: starts a real local TCP listener",
]

[tool.coverage.run]
branch = true
source = ["dolibarr_mcp"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "DTZ", "E", "EM", "ERA",
  "EXE", "F", "FA", "FBT", "FLY", "FURB", "G", "I", "ICN", "INP", "ISC",
  "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE",
  "RUF", "S", "SIM", "SLF", "T10", "T20", "TC", "TRY", "UP", "W",
]
ignore = [
  "ANN401",  # Framework boundaries legitimately accept arbitrary ASGI payloads.
  "PLR0913", # Typed constructors make dependency and timeout configuration explicit.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004", "SLF001", "TC001", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["dolibarr_mcp"]

[tool.ruff.format]
quote-style = "double"

[tool.codespell]
skip = "uv.lock,dist,build,.venv,.bootstrap-uv"
ignore-words-list = "dolibarr,dolapikey,thirdparty"
