name: Bug report
description: Report a reproducible defect without secrets or personal data
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, Authorization headers, internal URLs, identities, or exploit details.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use only fictitious credentials and sanitized configuration.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, OS, deployment mode, and sanitized Dolibarr version.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed all credentials, internal URLs, personal data, and sensitive logs.
          required: true
        - label: This is not a private vulnerability report.
          required: true
