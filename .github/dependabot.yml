version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    commit-message:
      prefix: deps
    groups:
      compatible-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci
    groups:
      compatible-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: build
    groups:
      compatible-minor-patch:
        update-types: [minor, patch]
