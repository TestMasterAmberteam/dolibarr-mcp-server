services:
  dolibarr-mcp:
    build:
      context: .
    image: dolibarr-mcp-server:0.4.0
    volumes:
      - ./config.toml:/app/config.toml:ro
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    init: true
    stop_grace_period: 30s
